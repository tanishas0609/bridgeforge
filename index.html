<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BridgeForge</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f8f6;--fg:#0d0d0b;--fg2:#6b6b67;--fg3:#b5b5b0;
  --line:#e8e8e4;--node-bg:#ffffff;--node-border:#e8e8e4;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --green:#15803d;--green-bg:#f0fdf4;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Geist',system-ui,sans-serif;
}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;min-height:100vh}

.page{max-width:760px;margin:0 auto;padding:0 28px 120px}

/* HEADER */
header{padding:60px 0 44px;border-bottom:1px solid var(--line);margin-bottom:44px}
.wordmark{font-family:var(--serif);font-size:2rem;letter-spacing:-0.02em;display:block;margin-bottom:6px}
.tagline{font-size:0.83rem;color:var(--fg2)}

/* INPUTS */
.input-row{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:8px;margin-bottom:14px}
.ig{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:0.6rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--fg3);font-weight:500}
.field{background:var(--node-bg);border:1px solid var(--node-border);border-radius:8px;padding:11px 14px;font-family:var(--sans);font-size:0.9rem;font-weight:400;color:var(--fg);outline:none;width:100%;transition:border-color .15s}
.field:focus{border-color:var(--fg2)}
.field::placeholder{color:var(--fg3)}
.arr{color:var(--fg3);text-align:center;font-size:1rem;padding-top:18px;user-select:none}

/* DEPTH CONTROL */
.depth-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:12px 14px;background:var(--node-bg);border:1px solid var(--node-border);border-radius:8px}
.depth-label{font-size:0.75rem;color:var(--fg2);white-space:nowrap}
.depth-btns{display:flex;gap:4px}
.depth-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--node-border);background:var(--bg);color:var(--fg2);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:var(--sans)}
.depth-btn.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.depth-hint{font-size:0.73rem;color:var(--fg3);margin-left:auto}

/* ACTIONS */
.action-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--sans);font-size:0.83rem;font-weight:400;padding:9px 18px;border-radius:7px;border:1px solid var(--node-border);background:var(--node-bg);color:var(--fg);cursor:pointer;transition:all .12s;letter-spacing:.01em}
.btn:hover{border-color:var(--fg2)}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-primary:hover{opacity:.82}
.btn-sm{font-size:0.76rem;padding:6px 13px}
.view-toggle{display:flex;gap:0;border:1px solid var(--node-border);border-radius:7px;overflow:hidden;margin-left:auto}
.vt-btn{font-family:var(--sans);font-size:0.76rem;padding:7px 13px;border:none;background:var(--node-bg);color:var(--fg2);cursor:pointer;transition:all .12s;letter-spacing:.01em}
.vt-btn.active{background:var(--fg);color:var(--bg)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:40px}
.chip{font-size:0.74rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg3);cursor:pointer;font-family:var(--sans);transition:all .12s}
.chip:hover{border-color:var(--fg2);color:var(--fg)}

/* OUTPUT */
.bridge-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.bridge-title{font-family:var(--serif);font-size:1.3rem;letter-spacing:-.01em}
.bridge-meta{font-size:0.74rem;color:var(--fg3);display:flex;gap:10px}
.badge{padding:2px 8px;border-radius:4px;font-size:0.68rem;font-weight:500;letter-spacing:.04em}
.badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid #bbf7d0}

/* PATH VIEW */
.track{position:relative;display:flex;flex-direction:column;margin-bottom:24px}
.track::before{content:'';position:absolute;left:19px;top:22px;bottom:22px;width:1px;background:var(--line);z-index:0}
.step{display:grid;grid-template-columns:40px 1fr;gap:0 14px;align-items:start;padding:11px 0;position:relative;z-index:1;animation:sIn .35s cubic-bezier(.22,1,.36,1) both}
@keyframes sIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.dot{width:40px;height:40px;border-radius:50%;border:1px solid var(--node-border);background:var(--node-bg);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:500;color:var(--fg2);flex-shrink:0;position:relative;z-index:2}
.dot-s{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot-e{background:var(--blue);color:#fff;border-color:var(--blue)}
.step-body{padding-top:9px}
.concept{font-family:var(--serif);font-size:1rem;color:var(--fg);margin-bottom:3px;line-height:1.3}
.desc{font-size:0.79rem;color:var(--fg2);line-height:1.55}
.why{margin-top:5px;font-size:0.74rem;color:var(--fg3);font-style:italic}
.shared-tag{display:inline-block;font-size:0.65rem;padding:1px 6px;border-radius:3px;background:var(--blue-bg);color:var(--blue);margin-left:8px;vertical-align:middle;border:1px solid var(--blue-border)}

/* INSIGHT */
.insight{background:var(--node-bg);border:1px solid var(--node-border);border-left:2px solid var(--fg);border-radius:0 8px 8px 0;padding:15px 18px;margin-bottom:18px;animation:sIn .35s .1s both}
.mini-label{font-size:0.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px}
.insight-text{font-family:var(--serif);font-size:.96rem;line-height:1.65;font-style:italic}

/* RELATED */
.related{background:var(--node-bg);border:1px solid var(--node-border);border-radius:8px;padding:15px 18px;margin-bottom:18px;animation:sIn .35s .15s both}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:0.74rem;padding:4px 10px;border-radius:5px;background:var(--blue-bg);color:var(--blue);cursor:pointer;font-family:var(--sans);border:none;transition:opacity .12s}
.tag:hover{opacity:.7}

/* SHARE ROW */
.share-row{display:flex;gap:8px;padding-top:4px;animation:sIn .3s both}

/* GRAPH VIEW */
#graph-wrap{width:100%;height:500px;background:var(--node-bg);border:1px solid var(--node-border);border-radius:12px;overflow:hidden;position:relative;animation:sIn .4s both}
#graph-wrap svg{width:100%;height:100%}
.graph-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:0.72rem;color:var(--fg3);background:var(--node-bg);padding:4px 10px;border-radius:999px;border:1px solid var(--line);pointer-events:none}
.node-label{font-family:'Geist',system-ui,sans-serif;font-size:11px;fill:var(--fg);pointer-events:none;font-weight:400}

/* NO PATH */
.no-path{border:1px solid var(--node-border);border-left:2px solid var(--fg3);border-radius:0 8px 8px 0;padding:15px 18px;font-size:0.85rem;color:var(--fg2);line-height:1.65}
.no-path strong{font-weight:500;color:var(--fg)}

/* LOADING */
.loading{font-size:0.8rem;color:var(--fg2);display:flex;align-items:center;gap:8px;padding:16px 0}
.dots span{width:4px;height:4px;border-radius:50%;background:var(--fg2);display:inline-block;animation:p 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* HISTORY */
.history{margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}
.history-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

@media(max-width:520px){
  .input-row{grid-template-columns:1fr}.arr{display:none}
  header{padding:36px 0 28px}
  #graph-wrap{height:360px}
}
</style>
</head>
<body>
<div class="page">
<header>
  <span class="wordmark">BridgeForge</span>
  <p class="tagline">Discover hidden paths between any two ideas</p>
</header>

<div class="input-row">
  <div class="ig"><span class="lbl">From</span><input class="field" id="start" placeholder="e.g. Music" autocomplete="off"></div>
  <div class="arr">→</div>
  <div class="ig"><span class="lbl">To</span><input class="field" id="end" placeholder="e.g. Mathematics" autocomplete="off"></div>
</div>

<div class="depth-row">
  <span class="depth-label">Bridge depth</span>
  <div class="depth-btns">
    <button class="depth-btn" data-d="3" onclick="setDepth(3)">3</button>
    <button class="depth-btn active" data-d="5" onclick="setDepth(5)">5</button>
    <button class="depth-btn" data-d="7" onclick="setDepth(7)">7</button>
    <button class="depth-btn" data-d="9" onclick="setDepth(9)">9</button>
  </div>
  <span class="depth-hint" id="depth-hint">Balanced path</span>
</div>

<div class="action-row">
  <button class="btn btn-primary" id="build-btn" onclick="buildBridge()">Build bridge</button>
  <button class="btn" onclick="surpriseMe()">Surprise me</button>
  <div class="view-toggle" id="view-toggle" style="display:none">
    <button class="vt-btn active" id="vt-path" onclick="showView('path')">Path</button>
    <button class="vt-btn" id="vt-graph" onclick="showView('graph')">Graph</button>
  </div>
</div>

<div class="chips" id="chips"></div>
<div id="output"></div>
<div id="history"></div>
</div>

// BUILD ADJACENCY MAP
// ═══════════════════════════════════════════════
const ADJ = {};
const EDGE_REASONS = {};

function edgeKey(a, b) { return [a,b].sort().join('|||'); }

EDGES.forEach(([a, b, reasonAB, reasonBA]) => {
  if (!ADJ[a]) ADJ[a] = [];
  if (!ADJ[b]) ADJ[b] = [];
  ADJ[a].push(b);
  ADJ[b].push(a);
  const k = edgeKey(a, b);
  EDGE_REASONS[k] = { [a]: reasonAB || '', [b]: reasonBA || '' };
});

// FUZZY MATCH
// ═══════════════════════════════════════════════
function normalize(s) { return s.toLowerCase().replace(/[^a-z0-9]/g,'').trim(); }

function fuzzyMatch(input) {
  const n = normalize(input);
  // 1. Exact id match
  if (NODES[n]) return n;
  // 2. Label match
  for (const [id, node] of Object.entries(NODES)) {
    if (normalize(node.label) === n) return id;
  }
  // 3. Partial/contains
  let best = null, bestScore = 0;
  for (const [id, node] of Object.entries(NODES)) {
    const nid = normalize(id);
    const nlabel = normalize(node.label);
    if (nid.includes(n) || n.includes(nid)) { const s = Math.min(n.length, nid.length)/Math.max(n.length, nid.length); if(s > bestScore){bestScore=s;best=id;} }
    if (nlabel.includes(n) || n.includes(nlabel)) { const s = Math.min(n.length, nlabel.length)/Math.max(n.length, nlabel.length); if(s > bestScore){bestScore=s;best=id;} }
  }
  if (best && bestScore > 0.4) return best;
  // 4. Tag match
  for (const [id, node] of Object.entries(NODES)) {
    if (node.tags && node.tags.some(t => normalize(t) === n)) return id;
  }
  // 5. Bigram similarity
  function bigrams(s) { const b=new Set(); for(let i=0;i<s.length-1;i++) b.add(s.slice(i,i+2)); return b; }
  const nb = bigrams(n);
  let bBest = null, bScore = 0;
  for (const [id, node] of Object.entries(NODES)) {
    const tb = bigrams(normalize(node.label));
    const inter = [...nb].filter(x => tb.has(x)).length;
    const score = inter / (nb.size + tb.size - inter + 0.001);
    if (score > bScore) { bScore = score; bBest = id; }
  }
  if (bBest && bScore > 0.25) return bBest;
  return null;
}

// BIDIRECTIONAL BFS PATHFINDING
// ═══════════════════════════════════════════════
function biBFS(startId, endId, maxDepth) {
  if (startId === endId) return [startId];

  const fwd = new Map([[startId, [startId]]]);
  const bwd = new Map([[endId, [endId]]]);
  const fVisited = new Set([startId]);
  const bVisited = new Set([endId]);
  const fQueue = [startId];
  const bQueue = [endId];

  for (let depth = 0; depth < maxDepth; depth++) {
    // Expand smaller frontier
    const expandFwd = fQueue.length <= bQueue.length;
    const queue = expandFwd ? fQueue : bQueue;
    const visited = expandFwd ? fVisited : bVisited;
    const pathMap = expandFwd ? fwd : bwd;
    const otherPathMap = expandFwd ? bwd : fwd;
    const otherVisited = expandFwd ? bVisited : fVisited;

    const nextQueue = [];
    const levelNodes = [...queue];
    queue.length = 0;

    for (const node of levelNodes) {
      for (const neighbor of (ADJ[node] || [])) {
        if (!visited.has(neighbor)) {
          visited.add(neighbor);
          const path = [...pathMap.get(node), neighbor];
          pathMap.set(neighbor, path);
          nextQueue.push(neighbor);

          if (otherVisited.has(neighbor)) {
            const otherPath = otherPathMap.get(neighbor);
            if (expandFwd) {
              return [...path, ...otherPath.slice(1).reverse()];
            } else {
              return [...otherPath, ...path.slice(1).reverse()];
            }
          }
        }
      }
    }
    queue.push(...nextQueue);
    if (!queue.length) break;
  }

  // No path found — build indirect path via shared-tag hops
  return buildIndirectPath(startId, endId, maxDepth);
}

function buildIndirectPath(startId, endId, maxDepth) {
  // Find nodes sharing tags with both endpoints
  const startTags = new Set(NODES[startId]?.tags || []);
  const endTags = new Set(NODES[endId]?.tags || []);

  const scored = Object.entries(NODES)
    .filter(([id]) => id !== startId && id !== endId)
    .map(([id, node]) => {
      const t = new Set(node.tags || []);
      const s = [...t].filter(x => startTags.has(x)).length + [...t].filter(x => endTags.has(x)).length;
      return { id, score: s };
    })
    .sort((a,b) => b.score - a.score);

  const bridges = scored.slice(0, maxDepth - 2).map(s => s.id);
  const path = [startId, ...bridges.slice(0, Math.min(bridges.length, maxDepth - 2)), endId];

  // Try to find BFS sub-paths between each hop
  const result = [startId];
  for (let i = 0; i < path.length - 1; i++) {
    const sub = simpleBFS(path[i], path[i+1], 3);
    if (sub && sub.length > 1) result.push(...sub.slice(1));
    else result.push(path[i+1]);
  }
  // Deduplicate
  return [...new Set(result)];
}

function simpleBFS(startId, endId, maxDepth) {
  if (startId === endId) return [startId];
  const visited = new Set([startId]);
  const queue = [[startId, [startId]]];
  while (queue.length) {
    const [node, path] = queue.shift();
    if (path.length > maxDepth + 1) break;
    for (const n of (ADJ[node] || [])) {
      if (!visited.has(n)) {
        const np = [...path, n];
        if (n === endId) return np;
        visited.add(n);
        queue.push([n, np]);
      }
    }
  }
  return null;
}

// ═══════════════════════════════════════════════
// TRIM PATH TO DEPTH
// ═══════════════════════════════════════════════
function trimToDepth(path, maxSteps) {
  if (path.length <= maxSteps + 1) return path;
  // Keep start, end, and evenly-spaced intermediates
  const result = [path[0]];
  const middle = path.slice(1, -1);
  const pick = maxSteps - 1;
  const step = (middle.length - 1) / (pick - 1 + 0.001);
  for (let i = 0; i < pick && i < middle.length; i++) {
    result.push(middle[Math.round(i * step)]);
  }
  result.push(path[path.length - 1]);
  return [...new Set(result)];
}

// ═══════════════════════════════════════════════
// INSIGHT GENERATION
// ═══════════════════════════════════════════════
const INSIGHT_TEMPLATES = [
  (a, b, mid) => `${a} and ${b} both reduce to ${mid} when you strip away the medium.`,
  (a, b, mid) => `The path from ${a} to ${b} runs through ${mid} — the concept neither field admits it shares.`,
  (a, b) => `What ${a} does with sound, ${b} does with symbols — same structure, different substrate.`,
  (a, b, mid) => `${mid} is the ghost haunting both ${a} and ${b}.`,
  (a, b) => `${a} is ${b} running at a different speed.`,
  (a, b, mid) => `Strip ${a} to its skeleton and you find ${mid}. Strip ${b} and you find the same thing.`,
  (a, b) => `Every practitioner of ${a} is secretly asking the questions ${b} was built to answer.`,
  (a, b, mid) => `The bridge exists because ${mid} doesn't care which side of the wall it's on.`,
];

function generateInsight(path, startLabel, endLabel) {
  const midIdx = Math.floor(path.length / 2);
  const midLabel = NODES[path[midIdx]]?.label || path[midIdx];
  const t = INSIGHT_TEMPLATES[Math.floor(Math.random() * INSIGHT_TEMPLATES.length)];
  return t(startLabel, endLabel, midLabel);
}

// Related pairs: nodes connected to both endpoints
function getRelatedPairs(startId, endId) {
  const startNeighbors = new Set(ADJ[startId] || []);
  const endNeighbors = new Set(ADJ[endId] || []);
  const pairs = [];
  // Pairs where both share a neighbor
  for (const n of startNeighbors) {
    for (const m of endNeighbors) {
      if (n !== m && n !== endId && m !== startId && ADJ[n] && ADJ[n].includes(m)) {
        pairs.push([NODES[n]?.label || n, NODES[m]?.label || m]);
        if (pairs.length >= 3) return pairs;
      }
    }
  }
  // Fallback: random neighbor pairs
  const sArr = [...startNeighbors].filter(x => x !== endId).slice(0, 3);
  const eArr = [...endNeighbors].filter(x => x !== startId).slice(0, 3);
  for (let i = 0; i < Math.min(sArr.length, eArr.length, 3); i++) {
    pairs.push([NODES[sArr[i]]?.label || sArr[i], NODES[eArr[i]]?.label || eArr[i]]);
  }
  return pairs.slice(0, 3);
}

// Shared tags between two nodes
function sharedTags(a, b) {
  const ta = new Set(NODES[a]?.tags || []);
  return (NODES[b]?.tags || []).filter(t => ta.has(t));
}

// ═══════════════════════════════════════════════
// STATE & UI
// ═══════════════════════════════════════════════
let currentDepth = 5;
let currentView = 'path';
let currentResult = null;
let historyStore = [];
const DEPTH_HINTS = { 3:"Direct route", 5:"Balanced path", 7:"Scenic route", 9:"Deep exploration" };

const PRESETS = [
  ["Jazz","Quantum physics"],["Bread","Democracy"],["Sleep","Creativity"],
  ["Fire","Language"],["Chess","Warfare"],["Grief","Mathematics"],
  ["Ocean","Memory"],["Music","Architecture"],["Money","Trust"],
  ["Bacteria","Internet"],["Running","Meditation"],["Maps","Power"],
];

const SURPRISES = [
  ...PRESETS,
  ["Gravity","Love"],["Dreams","Economics"],["Language","DNA"],
  ["Shadows","Identity"],["Cooking","Chemistry"],["Childhood","War"],
  ["Religion","Science"],["Light","Art"],["Dance","Politics"],
  ["Entropy","Creativity"],["Consciousness","Economics"],["Film","Evolution"],
];

function init() {
  const chips = document.getElementById('chips');
  PRESETS.slice(0,8).forEach(([a,b]) => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = `${a} → ${b}`;
    c.onclick = () => quickBuild(a, b);
    chips.appendChild(c);
  });

  document.querySelectorAll('.depth-btn').forEach(btn => {
    btn.onclick = () => setDepth(parseInt(btn.dataset.d));
  });

  ['start','end'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') buildBridge();
    });
  });

  const p = new URLSearchParams(location.search);
  if (p.get('from') && p.get('to')) {
    setTimeout(() => quickBuild(p.get('from'), p.get('to')), 300);
  }
}

function setDepth(d) {
  currentDepth = d;
  document.querySelectorAll('.depth-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.d) === d));
  document.getElementById('depth-hint').textContent = DEPTH_HINTS[d] || '';
}

function quickBuild(a, b) {
  document.getElementById('start').value = a;
  document.getElementById('end').value = b;
  buildBridge();
}

function surpriseMe() {
  const used = new Set(historyStore.map(([a,b]) => a+'|'+b));
  const pool = SURPRISES.filter(([a,b]) => !used.has(a+'|'+b));
  const [a, b] = (pool.length ? pool : SURPRISES)[Math.floor(Math.random() * (pool.length || SURPRISES.length))];
  quickBuild(a, b);
}

function buildBridge() {
  const rawStart = document.getElementById('start').value.trim();
  const rawEnd = document.getElementById('end').value.trim();
  if (!rawStart || !rawEnd) return;

  const out = document.getElementById('output');
  out.innerHTML = `<div class="loading"><div class="dots"><span></span><span></span><span></span></div>Tracing path…</div>`;
  document.getElementById('view-toggle').style.display = 'none';

  // Slight timeout so loading state renders
  setTimeout(() => {
    const startId = fuzzyMatch(rawStart);
    const endId = fuzzyMatch(rawEnd);

    if (!startId || !endId) {
      const missing = !startId ? rawStart : rawEnd;
      out.innerHTML = `<div class="no-path">
        <strong>Unknown concept: "${missing}"</strong><br>
        Try a different word, or pick from the suggestion chips below.
        <div style="margin-top:12px;font-size:0.76rem;color:var(--fg3)">
          Known concepts include: ${Object.values(NODES).map(n=>n.label).sort().join(', ')}
        </div>
      </div>`;
      return;
    }

    let rawPath = biBFS(startId, endId, currentDepth + 4);
    const path = trimToDepth(rawPath, currentDepth);

    currentResult = { startId, endId, path, rawStart, rawEnd };
    renderPath(path, startId, endId);
    addHistory(rawStart, rawEnd);

    document.getElementById('view-toggle').style.display = 'flex';
    showView(currentView);
  }, 80);
}

function showView(v) {
  currentView = v;
  document.getElementById('vt-path').classList.toggle('active', v === 'path');
  document.getElementById('vt-graph').classList.toggle('active', v === 'graph');
  if (!currentResult) return;
  if (v === 'path') renderPath(currentResult.path, currentResult.startId, currentResult.endId);
  else renderGraph(currentResult.path, currentResult.startId, currentResult.endId);
}

function renderPath(path, startId, endId) {
  const out = document.getElementById('output');
  const startLabel = NODES[startId]?.label || startId;
  const endLabel = NODES[endId]?.label || endId;
  const insight = generateInsight(path, startLabel, endLabel);
  const related = getRelatedPairs(startId, endId);

  let stepsHTML = '';
  path.forEach((nodeId, i) => {
    const node = NODES[nodeId] || { label: nodeId, desc: '' };
    const isFirst = i === 0, isLast = i === path.length - 1;
    const nextId = path[i + 1];
    const reason = nextId ? (EDGE_REASONS[edgeKey(nodeId, nextId)]?.[nodeId] || '') : '';
    const shared = nextId ? sharedTags(nodeId, nextId) : [];
    const dotClass = isFirst ? 'dot dot-s' : isLast ? 'dot dot-e' : 'dot';
    const dotLabel = isFirst ? '○' : isLast ? '●' : i + 1;
    const sharedHTML = shared.length ? `<span class="shared-tag">${shared[0]}</span>` : '';
    stepsHTML += `
      <div class="step" style="animation-delay:${i*0.07}s">
        <div class="${dotClass}">${dotLabel}</div>
        <div class="step-body">
          <div class="concept">${node.label}${sharedHTML}</div>
          <div class="desc">${node.desc}</div>
          ${reason ? `<div class="why">${reason}</div>` : ''}
        </div>
      </div>`;
  });

  const relatedHTML = related.length ? `
    <div class="related">
      <div class="mini-label">Related bridges</div>
      <div class="tags">${related.map(([a,b]) => `<button class="tag" onclick="quickBuild(${JSON.stringify(a)},${JSON.stringify(b)})">${a} → ${b}</button>`).join('')}</div>
    </div>` : '';

  out.innerHTML = `
    <div class="bridge-hdr">
      <div class="bridge-title">${startLabel} → ${endLabel}</div>
      <div class="bridge-meta">
        <span class="badge badge-blue">${path.length} steps</span>
        <span class="badge badge-green">Depth ${currentDepth}</span>
      </div>
    </div>
    <div class="track">${stepsHTML}</div>
    <div class="insight">
      <div class="mini-label">Bridge insight</div>
      <div class="insight-text">${insight}</div>
    </div>
    ${relatedHTML}
    <div class="share-row">
      <button class="btn btn-sm" id="share-btn" onclick="copyShare()">Copy link</button>
    </div>`;
}

// ═══════════════════════════════════════════════
// D3 FORCE GRAPH
// ═══════════════════════════════════════════════
function renderGraph(path, startId, endId) {
  const out = document.getElementById('output');
  const startLabel = NODES[startId]?.label || startId;
  const endLabel = NODES[endId]?.label || endId;

  // Expand graph: path nodes + 1-hop neighbours (limited)
  const pathSet = new Set(path);
  const graphNodes = new Set(path);
  path.forEach(id => {
    (ADJ[id] || []).slice(0, 4).forEach(n => graphNodes.add(n));
  });

  const nodeArr = [...graphNodes].map(id => ({
    id,
    label: NODES[id]?.label || id,
    onPath: pathSet.has(id),
    isStart: id === startId,
    isEnd: id === endId,
  }));

  const idSet = new Set(nodeArr.map(n => n.id));
  const linkArr = [];
  const seen = new Set();
  nodeArr.forEach(n => {
    (ADJ[n.id] || []).forEach(m => {
      if (idSet.has(m)) {
        const k = [n.id,m].sort().join('|');
        if (!seen.has(k)) { seen.add(k); linkArr.push({ source: n.id, target: m, onPath: pathSet.has(n.id) && pathSet.has(m) }); }
      }
    });
  });

  out.innerHTML = `
    <div class="bridge-hdr">
      <div class="bridge-title">${startLabel} → ${endLabel}</div>
      <div class="bridge-meta">
        <span class="badge badge-blue">${path.length} steps</span>
        <span class="badge badge-green">Depth ${currentDepth}</span>
      </div>
    </div>
    <div id="graph-wrap">
      <svg></svg>
      <div class="graph-hint">Drag nodes · Scroll to zoom</div>
    </div>`;

  const wrap = document.getElementById('graph-wrap');
  const W = wrap.clientWidth || 700, H = wrap.clientHeight || 500;
  const svg = d3.select('#graph-wrap svg').attr('viewBox', `0 0 ${W} ${H}`);

  const g = svg.append('g');

  svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', e => g.attr('transform', e.transform)));

  const sim = d3.forceSimulation(nodeArr)
    .force('link', d3.forceLink(linkArr).id(d => d.id).distance(d => d.onPath ? 90 : 140).strength(d => d.onPath ? 0.9 : 0.3))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide(36));

  const link = g.append('g').selectAll('line').data(linkArr).join('line')
    .attr('stroke', d => d.onPath ? '#1d4ed8' : '#e8e8e4')
    .attr('stroke-width', d => d.onPath ? 2.5 : 1)
    .attr('stroke-opacity', d => d.onPath ? 0.9 : 0.5);

  const node = g.append('g').selectAll('g').data(nodeArr).join('g')
    .attr('cursor', 'grab')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e, d) => { d.fx=e.x; d.fy=e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  node.append('circle')
    .attr('r', d => d.isStart || d.isEnd ? 22 : d.onPath ? 18 : 12)
    .attr('fill', d => d.isStart ? '#0d0d0b' : d.isEnd ? '#1d4ed8' : d.onPath ? '#eff6ff' : '#ffffff')
    .attr('stroke', d => d.isStart ? '#0d0d0b' : d.isEnd ? '#1d4ed8' : d.onPath ? '#bfdbfe' : '#e8e8e4')
    .attr('stroke-width', d => d.onPath ? 1.5 : 1);

  node.append('text')
    .text(d => d.label)
    .attr('text-anchor', 'middle')
    .attr('dy', d => (d.isStart || d.isEnd ? 32 : 26))
    .attr('class', 'node-label')
    .attr('fill', d => d.isStart || d.isEnd ? '#0d0d0b' : d.onPath ? '#1d4ed8' : '#6b6b67')
    .attr('font-weight', d => d.onPath ? '500' : '300');

  // Labels on large circles
  node.filter(d => d.isStart || d.isEnd || d.onPath).append('text')
    .text(d => d.isStart ? '○' : d.isEnd ? '●' : '')
    .attr('text-anchor', 'middle').attr('dy', '0.35em')
    .attr('fill', d => d.isStart ? '#f8f8f6' : '#fff')
    .attr('font-size', 14)
    .attr('pointer-events', 'none');

  sim.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function copyShare() {
  const s = document.getElementById('start').value.trim();
  const e = document.getElementById('end').value.trim();
  const url = `${location.origin}${location.pathname}?from=${encodeURIComponent(s)}&to=${encodeURIComponent(e)}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('share-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy link', 2000);
  });
}

function addHistory(a, b) {
  historyStore = [[a,b], ...historyStore.filter(([x,y]) => !(x===a && y===b))].slice(0,5);
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history');
  if (!historyStore.length) { el.innerHTML=''; return; }
  el.innerHTML = `<div class="history" style="margin-top:40px;padding-top:18px;border-top:1px solid var(--line)">
    <div class="lbl" style="margin-bottom:10px">Previously explored</div>
    <div class="history-chips">
      ${historyStore.map(([a,b]) => `<button class="chip" onclick="quickBuild(${JSON.stringify(a)},${JSON.stringify(b)})">${a} → ${b}</button>`).join('')}
    </div>
  </div>`;
}

window.addEventListener('load', init);
</script>
</body>
</html>
