<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BridgeForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#fafaf8;
  --fg:#0a0a09;
  --fg2:#6b6b67;
  --fg3:#b0b0ab;
  --line:#e4e4e0;
  --accent:#1a1a18;
  --blue:#2563eb;
  --blue-dim:#dbeafe;
  --node-bg:#fff;
  --node-border:#e4e4e0;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Geist',system-ui,sans-serif;
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c0c0b;
    --fg:#f0f0ec;
    --fg2:#9a9a94;
    --fg3:#4a4a46;
    --line:#222220;
    --accent:#f0f0ec;
    --blue:#60a5fa;
    --blue-dim:#1e3a5f;
    --node-bg:#141412;
    --node-border:#282826;
  }
}

html{font-size:16px;-webkit-font-smoothing:antialiased}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--sans);
  font-weight:300;
  min-height:100vh;
  padding:0 0 120px;
}

/* ── LAYOUT ────────────────── */
.wrap{max-width:720px;margin:0 auto;padding:0 24px}

/* ── HEADER ────────────────── */
header{
  padding:72px 0 56px;
  border-bottom:1px solid var(--line);
  margin-bottom:56px;
}
.wordmark{
  font-family:var(--serif);
  font-size:2rem;
  letter-spacing:-0.02em;
  line-height:1;
  color:var(--fg);
  display:block;
  margin-bottom:10px;
}
.tagline{
  font-size:0.875rem;
  color:var(--fg2);
  letter-spacing:0.01em;
}

/* ── INPUTS ────────────────── */
.input-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}
.input-group{display:flex;flex-direction:column;gap:6px}
.input-label{
  font-size:0.65rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--fg3);
  font-weight:500;
}
.field{
  background:var(--node-bg);
  border:1px solid var(--node-border);
  border-radius:8px;
  padding:12px 14px;
  font-family:var(--sans);
  font-size:0.9375rem;
  font-weight:400;
  color:var(--fg);
  outline:none;
  width:100%;
  transition:border-color 0.15s;
}
.field::placeholder{color:var(--fg3)}
.field:focus{border-color:var(--fg2)}
.arrow-sep{
  font-size:1.2rem;
  color:var(--fg3);
  text-align:center;
  padding-top:18px;
  user-select:none;
}

/* ── ACTIONS ────────────────── */
.action-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:32px;
}
.btn{
  font-family:var(--sans);
  font-size:0.875rem;
  font-weight:400;
  padding:10px 20px;
  border-radius:7px;
  border:1px solid var(--node-border);
  background:var(--node-bg);
  color:var(--fg);
  cursor:pointer;
  transition:all 0.12s;
  letter-spacing:0.01em;
}
.btn:hover{border-color:var(--fg2);color:var(--fg)}
.btn-primary{
  background:var(--fg);
  color:var(--bg);
  border-color:var(--fg);
}
.btn-primary:hover{opacity:0.85;color:var(--bg)}
.btn-primary:disabled{opacity:0.4;cursor:default}
.btn-sm{
  font-size:0.8125rem;
  padding:7px 14px;
}

/* ── CHIPS ────────────────── */
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:48px;
}
.chip{
  font-size:0.78rem;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--fg2);
  cursor:pointer;
  font-family:var(--sans);
  font-weight:400;
  transition:all 0.12s;
}
.chip:hover{border-color:var(--fg2);color:var(--fg)}

/* ── OUTPUT AREA ────────────── */
#output{min-height:40px}

.status-line{
  font-size:0.8125rem;
  color:var(--fg2);
  padding:16px 0;
  display:flex;
  align-items:center;
  gap:8px;
}
.dot-pulse{display:inline-flex;gap:3px}
.dot-pulse span{
  width:4px;height:4px;border-radius:50%;
  background:var(--fg2);
  animation:pulse 1.2s ease-in-out infinite;
}
.dot-pulse span:nth-child(2){animation-delay:0.2s}
.dot-pulse span:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{opacity:0.2}40%{opacity:1}}

/* ── BRIDGE VISUAL ────────────── */
.bridge-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:28px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.bridge-title{
  font-family:var(--serif);
  font-size:1.375rem;
  letter-spacing:-0.01em;
  color:var(--fg);
}
.bridge-meta{font-size:0.78rem;color:var(--fg3)}

.path-track{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:0;
  margin-bottom:32px;
}

/* vertical connector line */
.path-track::before{
  content:'';
  position:absolute;
  left:19px;
  top:20px;
  bottom:20px;
  width:1px;
  background:var(--line);
  z-index:0;
}

.step{
  display:grid;
  grid-template-columns:40px 1fr;
  gap:0 16px;
  align-items:start;
  padding:14px 0;
  position:relative;
  z-index:1;
  animation:stepIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes stepIn{
  from{opacity:0;transform:translateX(-8px)}
  to{opacity:1;transform:translateX(0)}
}

.step-dot{
  width:40px;height:40px;
  border-radius:50%;
  border:1px solid var(--node-border);
  background:var(--node-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0.75rem;
  font-weight:500;
  color:var(--fg2);
  flex-shrink:0;
  position:relative;
  z-index:2;
  transition:all 0.2s;
}

.step:first-child .step-dot{
  background:var(--fg);
  color:var(--bg);
  border-color:var(--fg);
}
.step:last-child .step-dot{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.step-body{padding-top:9px}
.step-concept{
  font-family:var(--serif);
  font-size:1.0625rem;
  letter-spacing:-0.01em;
  color:var(--fg);
  margin-bottom:4px;
  line-height:1.3;
}
.step-desc{
  font-size:0.8125rem;
  color:var(--fg2);
  line-height:1.6;
}
.step-logic{
  margin-top:6px;
  font-size:0.78rem;
  color:var(--fg3);
  font-style:italic;
}

/* ── INSIGHT BLOCK ────────────── */
.insight{
  background:var(--node-bg);
  border:1px solid var(--node-border);
  border-left:3px solid var(--fg);
  border-radius:0 8px 8px 0;
  padding:18px 20px;
  margin-bottom:24px;
  animation:stepIn 0.4s 0.1s both;
}
.insight-label{
  font-size:0.65rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--fg3);
  margin-bottom:8px;
}
.insight-text{
  font-family:var(--serif);
  font-size:1rem;
  line-height:1.65;
  color:var(--fg);
  font-style:italic;
}

/* ── DEEPDIVE BLOCK ────────────── */
.deepdive{
  background:var(--node-bg);
  border:1px solid var(--node-border);
  border-radius:8px;
  padding:18px 20px;
  margin-bottom:24px;
  animation:stepIn 0.4s 0.15s both;
}
.deepdive-label{
  font-size:0.65rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--fg3);
  margin-bottom:10px;
}
.deepdive-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag{
  font-size:0.78rem;
  padding:4px 10px;
  border-radius:5px;
  background:var(--blue-dim);
  color:var(--blue);
  cursor:pointer;
  font-family:var(--sans);
  border:none;
  transition:opacity 0.12s;
}
.tag:hover{opacity:0.75}
.deepdive-further{
  font-size:0.8125rem;
  color:var(--fg2);
  line-height:1.6;
}

/* ── HISTORY ────────────────── */
.history{margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.history-label{font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg3);margin-bottom:10px}
.history-list{display:flex;flex-wrap:wrap;gap:6px}

/* ── SHARE ROW ────────────────── */
.share-row{
  display:flex;gap:8px;align-items:center;
  padding-top:8px;
  animation:stepIn 0.3s both;
}

/* ── ERROR ────────────────── */
.error-block{
  border:1px solid var(--node-border);
  border-left:3px solid #dc2626;
  border-radius:0 8px 8px 0;
  padding:16px 18px;
  font-size:0.875rem;
  color:var(--fg2);
  line-height:1.6;
}

@media(max-width:520px){
  .input-row{grid-template-columns:1fr}
  .arrow-sep{display:none}
  header{padding:40px 0 36px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <span class="wordmark">BridgeForge</span>
  <p class="tagline">Trace the path between any two ideas</p>
</header>

<div class="input-row">
  <div class="input-group">
    <span class="input-label">From</span>
    <input class="field" id="start" placeholder="e.g. Music" autocomplete="off">
  </div>
  <div class="arrow-sep">→</div>
  <div class="input-group">
    <span class="input-label">To</span>
    <input class="field" id="end" placeholder="e.g. Mathematics" autocomplete="off">
  </div>
</div>

<div class="action-row">
  <button class="btn btn-primary" id="build-btn" onclick="buildBridge()">Build bridge</button>
  <button class="btn" onclick="surpriseMe()">Surprise me</button>
</div>

<div class="chips" id="chips">
  <button class="chip" onclick="quickBuild('Jazz','Quantum physics')">Jazz → Quantum physics</button>
  <button class="chip" onclick="quickBuild('Bread','Democracy')">Bread → Democracy</button>
  <button class="chip" onclick="quickBuild('Sleep','Creativity')">Sleep → Creativity</button>
  <button class="chip" onclick="quickBuild('Fire','Language')">Fire → Language</button>
  <button class="chip" onclick="quickBuild('Chess','Warfare')">Chess → Warfare</button>
  <button class="chip" onclick="quickBuild('Grief','Mathematics')">Grief → Mathematics</button>
</div>

<div id="output"></div>
<div id="history"></div>

</div>

<script>
const SURPRISES = [
  ['Jazz','Quantum physics'],['Bread','Democracy'],['Sleep','Creativity'],
  ['Fire','Language'],['Chess','Warfare'],['Grief','Mathematics'],
  ['Ocean','Memory'],['Architecture','Music'],['Money','Trust'],
  ['Bacteria','Internet'],['Running','Meditation'],['Maps','Power'],
  ['Childhood','War'],['Gravity','Love'],['Dreams','Economics'],
  ['Language','DNA'],['Shadows','Identity'],['Cooking','Chemistry'],
];

const historyStore = [];

function quickBuild(a, b) {
  document.getElementById('start').value = a;
  document.getElementById('end').value = b;
  buildBridge();
}

function surpriseMe() {
  const used = new Set(historyStore.map(h => h[0] + h[1]));
  const pool = SURPRISES.filter(p => !used.has(p[0] + p[1]));
  const [a, b] = (pool.length ? pool : SURPRISES)[Math.floor(Math.random() * (pool.length || SURPRISES.length))];
  document.getElementById('start').value = a;
  document.getElementById('end').value = b;
  buildBridge();
}

async function buildBridge() {
  const start = document.getElementById('start').value.trim();
  const end = document.getElementById('end').value.trim();
  if (!start || !end) return;

  const btn = document.getElementById('build-btn');
  btn.disabled = true;
  showLoading(start, end);

  try {
    const data = await callClaude(start, end);
    renderBridge(start, end, data);
    addHistory(start, end);
  } catch(e) {
    showError(e.message || 'Something went wrong. Please try again.');
  } finally {
    btn.disabled = false;
  }
}

function showLoading(start, end) {
  document.getElementById('output').innerHTML = `
    <div class="status-line">
      <div class="dot-pulse"><span></span><span></span><span></span></div>
      Tracing path from <em>${esc(start)}</em> to <em>${esc(end)}</em>&hellip;
    </div>`;
}

function showError(msg) {
  document.getElementById('output').innerHTML = `
    <div class="error-block">${esc(msg)}</div>`;
}

async function callClaude(start, end) {
  const SYSTEM = `You are BridgeForge, an expert at finding intellectually surprising conceptual bridges between two ideas.

Return ONLY valid JSON. No markdown, no code fences, no preamble. Schema:
{
  "steps": [
    {
      "concept": "string — the concept name (2-4 words max)",
      "description": "string — one crisp sentence explaining the concept",
      "logic": "string — one sentence explaining WHY this connects to the next step (omit on last step)"
    }
  ],
  "insight": "string — one punchy, memorable sentence that reframes the entire connection. No clichés.",
  "furtherReading": ["string", ...],
  "relatedPairs": [["A","B"], ["C","D"], ["E","F"]]
}

Rules:
- steps[0].concept = the FROM concept, steps[last].concept = the TO concept
- 5-7 steps total. Each step must be non-obvious but logically sound
- Prefer surprising intermediate concepts that most people wouldn't think of
- insight must be concrete and specific, not vague ("X is just Y in disguise" patterns work well)
- furtherReading: 3-4 actual book or paper titles (real ones) that illuminate the bridge
- relatedPairs: 3 other concept pairs that share a similar structural bridge`;

  const USER = `Build a bridge from "${start}" to "${end}".`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM,
      messages: [{ role: 'user', content: USER }]
    })
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${resp.status}`);
  }

  const body = await resp.json();
  const raw = body.content.find(b => b.type === 'text')?.text || '';

  let clean = raw.trim();
  if (clean.startsWith('```')) {
    clean = clean.replace(/^```[^\n]*\n?/, '').replace(/```$/, '').trim();
  }

  return JSON.parse(clean);
}

function renderBridge(start, end, data) {
  const el = document.getElementById('output');
  const stepCount = data.steps?.length || 0;

  let stepsHTML = '';
  (data.steps || []).forEach((step, i) => {
    const isFirst = i === 0;
    const isLast = i === stepCount - 1;
    const dotLabel = isFirst ? '○' : isLast ? '●' : (i + 1);
    const delay = `animation-delay:${i * 0.07}s`;
    stepsHTML += `
      <div class="step" style="${delay}">
        <div class="step-dot">${dotLabel}</div>
        <div class="step-body">
          <div class="step-concept">${esc(step.concept)}</div>
          <div class="step-desc">${esc(step.description)}</div>
          ${step.logic ? `<div class="step-logic">${esc(step.logic)}</div>` : ''}
        </div>
      </div>`;
  });

  let tagsHTML = '';
  if (data.relatedPairs?.length) {
    tagsHTML = data.relatedPairs.map(([a, b]) =>
      `<button class="tag" onclick="quickBuild(${JSON.stringify(a)},${JSON.stringify(b)})">${esc(a)} → ${esc(b)}</button>`
    ).join('');
  }

  let readingHTML = '';
  if (data.furtherReading?.length) {
    readingHTML = data.furtherReading.map(t => `<li>${esc(t)}</li>`).join('');
  }

  const bridgeTitle = `${esc(start)} → ${esc(end)}`;

  el.innerHTML = `
    <div class="bridge-header">
      <div class="bridge-title">${bridgeTitle}</div>
      <div class="bridge-meta">${stepCount} steps</div>
    </div>

    <div class="path-track">${stepsHTML}</div>

    ${data.insight ? `
    <div class="insight">
      <div class="insight-label">Bridge insight</div>
      <div class="insight-text">${esc(data.insight)}</div>
    </div>` : ''}

    ${(tagsHTML || readingHTML) ? `
    <div class="deepdive">
      <div class="deepdive-label">Explore further</div>
      ${tagsHTML ? `<div class="deepdive-tags">${tagsHTML}</div>` : ''}
      ${readingHTML ? `<div class="deepdive-further"><strong style="font-weight:500;font-size:0.78rem;color:var(--fg2)">Reading: </strong>${data.furtherReading.join(' · ')}</div>` : ''}
    </div>` : ''}

    <div class="share-row">
      <button class="btn btn-sm" id="share-btn" onclick="copyShare(${JSON.stringify(start)},${JSON.stringify(end)})">Copy link</button>
    </div>
  `;
}

function copyShare(start, end) {
  const url = `${location.origin}${location.pathname}?from=${encodeURIComponent(start)}&to=${encodeURIComponent(end)}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('share-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy link', 2000);
  });
}

function addHistory(start, end) {
  const exists = historyStore.find(h => h[0] === start && h[1] === end);
  if (!exists) historyStore.unshift([start, end]);
  if (historyStore.length > 5) historyStore.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history');
  if (!historyStore.length) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="history">
      <div class="history-label">Previously explored</div>
      <div class="history-list">
        ${historyStore.map(([a, b]) =>
          `<button class="chip" onclick="quickBuild(${JSON.stringify(a)},${JSON.stringify(b)})">${esc(a)} → ${esc(b)}</button>`
        ).join('')}
      </div>
    </div>`;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// URL params on load
window.addEventListener('load', () => {
  const p = new URLSearchParams(location.search);
  const from = p.get('from'), to = p.get('to');
  if (from && to) {
    document.getElementById('start').value = from;
    document.getElementById('end').value = to;
    buildBridge();
  }
});

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'start' || e.target.id === 'end')) buildBridge();
});
</script>
</body>
</html>
